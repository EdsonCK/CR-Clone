# Builds the Windows version (ClashClone.exe + everything it needs) on a real
# Windows machine. Run it from the Actions tab ("Build Windows" > Run
# workflow) or by pushing a tag like v1.4.9; download the zip from the run's
# "Artifacts" section.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install build tools
        run: python -m pip install "pygame==2.6.1" "pyinstaller==6.10.0"
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build tools/windows/ClashClone.spec
      - name: Smoke test (starts, then quits)
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"; $env:SDL_AUDIODRIVER = "dummy"
          $p = Start-Process dist/ClashClone/ClashClone.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "ClashClone.exe exited early (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: ClashClone-windows
          path: dist/ClashClone
